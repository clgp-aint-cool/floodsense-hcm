; Firmware ESP32 cho trạm quan trắc. Dùng chung logic với device-sim qua thư mục ../core.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -I../core/include
build_src_filter = +<*> +<../../core/src/*.cpp>
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    marcoschwartz/LiquidCrystal_I2C
